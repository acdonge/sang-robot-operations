schema_version: "0.1"

robot:
  robot_id: rb5_850e_sim_01
  model: rb5_850e
  embodiment: rb5_850e_v1
  real_or_sim: sim
  host_id: sim-isaac-01
  namespace: /robots/rb5_850e_sim_01

adapter:
  package: isaac_vendor
  executable: scene_runner
  kind: simulation_contract
  config_ref: sim/isaac_vendor/profiles.yaml#rb5
  version: "0.1.0"

capabilities:
  manipulation: true
  navigation: false
  arm_count: 1
  gripper: false
  camera: true
  force_torque: false

interfaces:
  state:
    - key: observation.state
      topics: [/rbpodo/joint_states]
      message_type: sensor_msgs/msg/JointState
      feature_names: [base, shoulder, elbow, wrist1, wrist2, wrist3]
      dtype: float32
      shape: [6]
      unit: rad
      freshness_ms: 1000
      minimum_rate_hz: 20
  action: []
  cameras:
    - key: cam_wrist
      topic: /rbpodo/camera/wrist/color/image_rect_raw/compressed
      message_type: sensor_msgs/msg/CompressedImage
      encoding: jpeg
      width: 640
      height: 480
      freshness_ms: 1000
      minimum_rate_hz: 25
    - key: cam_front
      topic: /rbpodo/camera/front/color/image_rect_raw/compressed
      message_type: sensor_msgs/msg/CompressedImage
      encoding: jpeg
      width: 640
      height: 480
      freshness_ms: 1000
      minimum_rate_hz: 25

monitoring:
  required_sources: [observation.state, cam_wrist, cam_front]

control:
  modes: [DISABLED]
  default_mode: DISABLED

ui:
  display_name: RB5-850E (Isaac Sim)
  order: 31
  panels: [health]
  camera_order: [cam_front, cam_wrist]
