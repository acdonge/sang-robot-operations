schema_version: "0.1"

robot:
  robot_id: omy_sim_01
  model: omy_f3m
  embodiment: omy_f3m_v1
  real_or_sim: sim
  host_id: sim-isaac-01
  namespace: /robots/omy_sim_01

adapter:
  package: isaac_vendor
  executable: scene_runner
  kind: simulation_contract
  config_ref: sim/isaac_vendor/profiles.yaml#omy
  version: "0.1.0"

capabilities:
  manipulation: true
  navigation: false
  arm_count: 1
  gripper: true
  camera: true
  force_torque: false

interfaces:
  state:
    - key: observation.state
      topics: [/joint_states]
      message_type: sensor_msgs/msg/JointState
      feature_names: [joint1, joint2, joint3, joint4, joint5, joint6, rh_r1_joint]
      dtype: float32
      shape: [7]
      unit: rad
      freshness_ms: 1000
      minimum_rate_hz: 20
  action: []
  cameras:
    - key: cam_wrist
      topic: /camera/cam_wrist/color/image_rect_raw/compressed
      message_type: sensor_msgs/msg/CompressedImage
      encoding: jpeg
      width: 848
      height: 480
      fps: 30
      freshness_ms: 1000
      minimum_rate_hz: 25
    - key: cam_top
      topic: /camera/cam_top/color/image_rect_raw/compressed
      message_type: sensor_msgs/msg/CompressedImage
      encoding: jpeg
      width: 848
      height: 480
      fps: 30
      freshness_ms: 1000
      minimum_rate_hz: 25

monitoring:
  required_sources: [observation.state, cam_wrist, cam_top]

control:
  modes: [DISABLED]
  default_mode: DISABLED

ui:
  display_name: OMY F3M (Isaac Sim)
  order: 21
  panels: [health]
  camera_order: [cam_top, cam_wrist]
