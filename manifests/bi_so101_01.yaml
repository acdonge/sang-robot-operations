schema_version: "0.1"

robot:
  robot_id: bi_so101_01
  model: bi_so101
  embodiment: bi_so101_v1
  real_or_sim: real
  host_id: workcell-soarm-01
  namespace: /robots/bi_so101_01
  frames:
    base: base_link
    tool: null
    odom: null
    map: null

adapter:
  package: so101_readonly_adapter
  executable: arm_reader
  kind: observation_adapter
  config_ref: config/bi_so101_hardware.yaml
  version: "0.1.0"

capabilities:
  manipulation: true
  navigation: false
  arm_count: 2
  gripper: true
  camera: true
  force_torque: false
  agent_actions:
    - capability: manipulation
      type: fleet_interfaces/action/ManipulateObject
      endpoint: /robots/bi_so101_01/actions/manipulate_object

interfaces:
  state:
    - key: observation.state
      topics:
        - /bi_so101/follower_left/joint_states_norm
        - /bi_so101/follower_right/joint_states_norm
      message_type: sensor_msgs/msg/JointState
      feature_names:
        - left_shoulder_pan
        - left_shoulder_lift
        - left_elbow_flex
        - left_wrist_flex
        - left_wrist_roll
        - left_gripper
        - right_shoulder_pan
        - right_shoulder_lift
        - right_elbow_flex
        - right_wrist_flex
        - right_wrist_roll
        - right_gripper
      topic_features:
        /bi_so101/follower_left/joint_states_norm:
          - left_shoulder_pan
          - left_shoulder_lift
          - left_elbow_flex
          - left_wrist_flex
          - left_wrist_roll
          - left_gripper
        /bi_so101/follower_right/joint_states_norm:
          - right_shoulder_pan
          - right_shoulder_lift
          - right_elbow_flex
          - right_wrist_flex
          - right_wrist_roll
          - right_gripper
      dtype: float32
      shape: [12]
      unit: lerobot_normalized
      freshness_ms: 1000
      minimum_rate_hz: 18
  action:
    - key: action
      topics:
        - /bi_so101/leader_left/joint_trajectory_norm
        - /bi_so101/leader_right/joint_trajectory_norm
      message_type: trajectory_msgs/msg/JointTrajectory
      feature_names:
        - left_shoulder_pan
        - left_shoulder_lift
        - left_elbow_flex
        - left_wrist_flex
        - left_wrist_roll
        - left_gripper
        - right_shoulder_pan
        - right_shoulder_lift
        - right_elbow_flex
        - right_wrist_flex
        - right_wrist_roll
        - right_gripper
      topic_features:
        /bi_so101/leader_left/joint_trajectory_norm:
          - left_shoulder_pan
          - left_shoulder_lift
          - left_elbow_flex
          - left_wrist_flex
          - left_wrist_roll
          - left_gripper
        /bi_so101/leader_right/joint_trajectory_norm:
          - right_shoulder_pan
          - right_shoulder_lift
          - right_elbow_flex
          - right_wrist_flex
          - right_wrist_roll
          - right_gripper
      dtype: float32
      shape: [12]
      semantics: absolute_joint_target
      unit: lerobot_normalized
      freshness_ms: 1000
      minimum_rate_hz: 18
  cameras:
    - key: top
      topic: /bi_so101/camera/top/color/image_rect_raw/compressed
      message_type: sensor_msgs/msg/CompressedImage
      encoding: jpeg
      width: 640
      height: 480
      fps: 30
      freshness_ms: 1000
      minimum_rate_hz: 25
    - key: left_side
      topic: /bi_so101/camera/left_side/color/image_rect_raw/compressed
      message_type: sensor_msgs/msg/CompressedImage
      encoding: jpeg
      width: 640
      height: 480
      fps: 30
      freshness_ms: 1000
      minimum_rate_hz: 25
    - key: right_side
      topic: /bi_so101/camera/right_side/color/image_rect_raw/compressed
      message_type: sensor_msgs/msg/CompressedImage
      encoding: jpeg
      width: 640
      height: 480
      fps: 30
      freshness_ms: 1000
      minimum_rate_hz: 25
    - key: left_wrist
      topic: /bi_so101/camera/left_wrist/color/image_rect_raw/compressed
      message_type: sensor_msgs/msg/CompressedImage
      encoding: jpeg
      width: 640
      height: 480
      fps: 30
      freshness_ms: 1000
      minimum_rate_hz: 25
    - key: right_wrist
      topic: /bi_so101/camera/right_wrist/color/image_rect_raw/compressed
      message_type: sensor_msgs/msg/CompressedImage
      encoding: jpeg
      width: 640
      height: 480
      fps: 30
      freshness_ms: 1000
      minimum_rate_hz: 25

monitoring:
  required_sources:
    - observation.state
    - top
    - left_side
    - right_side
    - left_wrist
    - right_wrist

control:
  modes: [DISABLED, TELEOP, POLICY]
  default_mode: DISABLED
  preset_mode: TELEOP
  heartbeat_ms: 100
  command_ttl_ms: 200
  safe_state_on_disconnect: controlled_hold
  rearm_required_after_disconnect: true

ui:
  display_name: Sang Dual SO-101
  order: 10
  panels: [recording, manipulation, health]
  camera_order: [top, left_side, right_side, left_wrist, right_wrist]
