schema_version: "0.1"

robot:
  robot_id: rb5_850e_01
  model: rb5_850e
  embodiment: rb5_850e_v1
  real_or_sim: real
  host_id: workcell-rb5-01
  namespace: /robots/rb5_850e_01

adapter:
  package: rb5_readonly_adapter
  executable: state_reader
  kind: readonly_vendor_data_adapter
  config_ref: 10.0.2.7:5001
  version: 0.1.0

capabilities:
  manipulation: true
  navigation: false
  arm_count: 1
  gripper: false
  camera: true
  force_torque: false

interfaces:
  state:
    - key: observation.state
      topics:
        - /rbpodo/joint_states
      message_type: sensor_msgs/msg/JointState
      feature_names:
        - base
        - shoulder
        - elbow
        - wrist1
        - wrist2
        - wrist3
      dtype: float32
      shape: [6]
      unit: rad
      freshness_ms: 1000
      minimum_rate_hz: 20
  action: []
  cameras:
    - key: cam_wrist
      topic: /rbpodo/camera/wrist/color/image_rect_raw/compressed
      message_type: sensor_msgs/msg/CompressedImage
      encoding: jpeg
      width: 848
      height: 480
      freshness_ms: 1500
      minimum_rate_hz: 8

monitoring:
  required_sources:
    - observation.state
    - cam_wrist

control:
  modes: [DISABLED]
  default_mode: DISABLED

ui:
  display_name: RB5-850E
  order: 30
  panels: [health]
  camera_order: [cam_wrist]
