<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>V2 Recorder</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #12141a; --card: #1c1f28; --line: #2c3040; --text: #e8eaf0;
    --dim: #8b90a0; --ok: #34c076; --warn: #e0a53a; --err: #e05555;
    --accent: #4d7fff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 system-ui, sans-serif; }
  header { padding: 12px 20px; border-bottom: 1px solid var(--line);
           display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 16px; margin: 0; }
  #conn { font-size: 12px; color: var(--dim); }
  #robots { padding: 16px; display: flex; flex-direction: column; gap: 16px; }

  .robot-card { background: var(--card); border: 1px solid var(--line);
                border-radius: 10px; padding: 16px; }
  .robot-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .robot-head .rid { font-size: 15px; font-weight: 600; }
  .badge { padding: 2px 10px; border-radius: 12px; font-size: 12px;
           border: 1px solid var(--line); color: var(--dim); }
  .badge.IDLE, .badge.READY { color: var(--ok); border-color: var(--ok); }
  .badge.RECORDING { color: var(--err); border-color: var(--err); }
  .badge.PREFLIGHT, .badge.WARMUP, .badge.COMMITTING { color: var(--warn); border-color: var(--warn); }
  .badge.ABORTING, .badge.FAULT { color: var(--err); border-color: var(--err); }

  .cams { display: grid; gap: 8px; margin-top: 12px;
          grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .cam { position: relative; background: #000; border-radius: 6px; overflow: hidden;
         aspect-ratio: 4 / 3; }
  .cam img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .cam .label { position: absolute; left: 6px; bottom: 6px; font-size: 11px;
                background: rgba(0,0,0,.6); padding: 1px 7px; border-radius: 4px; }
  .cam.stale::after { content: 'STALE'; position: absolute; inset: 0;
                      display: flex; align-items: center; justify-content: center;
                      color: var(--err); font-weight: 700; background: rgba(0,0,0,.55); }

  .controls { display: flex; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
  .controls input[type=text] { background: var(--bg); color: var(--text);
      border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; width: 220px; }
  button { border: 0; border-radius: 6px; padding: 8px 16px; font-weight: 600;
           cursor: pointer; color: #fff; }
  button:disabled { opacity: .35; cursor: default; }
  .b-start  { background: var(--accent); }
  .b-stop   { background: var(--ok); }
  .b-retry  { background: var(--warn); }
  .b-cont   { background: var(--accent); }
  .b-finish { background: #7a5cd6; }
  .b-abort  { background: var(--err); }
  #msg { margin-left: 8px; color: var(--dim); font-size: 12px; }
  .dim-label { color: var(--dim); font-size: 12px; }
  .controls input[type=number] { background: var(--bg); color: var(--text);
      border: 1px solid var(--line); border-radius: 6px; padding: 7px 6px; }
  .sys { margin-left: auto; font-size: 12px; color: var(--dim); }
  .sys.warn-sys { color: var(--err); font-weight: 700; }
  .badge.RESETTING { color: var(--warn); border-color: var(--warn); }

  table.health { margin-top: 12px; border-collapse: collapse; font-size: 12px; width: 100%; }
  table.health th, table.health td { text-align: left; padding: 3px 10px 3px 0;
                                     border-bottom: 1px solid var(--line); }
  table.health th { color: var(--dim); font-weight: 500; }
  td.fresh { color: var(--ok); } td.stale-t { color: var(--err); font-weight: 700; }
  .ep { margin-top: 8px; font-size: 12px; color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>V2 Recorder</h1>
  <span id="conn">connecting…</span>
  <span id="sysbar" class="sys"></span>
</header>
<div id="robots"></div>

<div class="robot-card" id="datasets-card" style="margin:16px">
  <div class="robot-head">
    <span class="rid">Datasets</span>
    <button id="ds-refresh" class="b-cont" style="padding:4px 12px;font-size:12px">↻ 새로고침</button>
    <span id="ds-msg" style="color:var(--dim);font-size:12px"></span>
  </div>
  <table class="health" id="ds-table">
    <thead><tr><th>dataset</th><th>task</th><th>ep</th><th>frames</th><th>size(MB)</th>
    <th>valid</th><th>HF</th><th></th></tr></thead>
    <tbody id="ds-body"></tbody>
  </table>
</div>

<div class="robot-card" id="train-card" style="margin:16px">
  <div class="robot-head">
    <span class="rid">Training</span>
    <span id="train-status" class="badge">idle</span>
    <span id="train-msg" style="color:var(--dim);font-size:12px"></span>
  </div>
  <div class="controls">
    <select id="train-ds" style="background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px"></select>
    <span class="dim-label">steps</span>
    <input id="train-steps" type="number" value="2000" style="width:80px">
    <button id="train-start" class="b-start">▶ Train (ACT)</button>
    <button id="train-stop" class="b-abort" disabled>■ Stop</button>
  </div>
  <div id="train-progress" class="ep"></div>
</div>

<div class="robot-card" id="infer-card" style="margin:16px">
  <div class="robot-head">
    <span class="rid">Inference</span>
    <span id="infer-status" class="badge">idle</span>
    <span id="infer-msg" style="color:var(--dim);font-size:12px"></span>
  </div>
  <div class="controls">
    <select id="infer-policy" style="background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px;max-width:420px"></select>
    <button id="infer-start" class="b-start">▶ Run Policy</button>
    <button id="infer-stop" class="b-abort" disabled>■ Stop</button>
    <span class="dim-label">⚠ fake_robot/sim 전용 — 실로봇은 M7 안전게이트 후</span>
  </div>
  <div id="infer-progress" class="ep"></div>
</div>

<script>
"use strict";
// ── API 계약 (M4-⑤ 게이트웨이가 구현) ─────────────────────────────
//  GET  /api/robots                                → [{robot_id, model, cameras:[key], fps}]
//  GET  /api/robots/{id}/health                    → {fsm_state, sources:{key:{age_ms,seq,fresh}}}
//  POST /api/robots/{id}/record/start
//       {task, task_instructions:[..], episode_time_s, reset_time_s, num_episodes, rosbag}
//                                                   → {session_id} | 409 {error}
//  POST /api/robots/{id}/record/save_next          → 현 에피소드 저장 후 RESETTING
//  POST /api/robots/{id}/record/retry              → 현 에피소드 폐기 후 RESETTING
//  POST /api/robots/{id}/record/continue           → RESETTING 스킵, 다음 에피소드 시작
//  POST /api/robots/{id}/record/finish             → 저장+finalize+검증+승격 {dataset_path}
//  POST /api/robots/{id}/record/stop               → (구버전 별칭: finish와 동일)
//  POST /api/robots/{id}/record/abort              → 세션 전체 폐기 {aborted:true}
//  GET  /api/robots/{id}/cameras/{key}/stream      → MJPEG (multipart/x-mixed-replace)
//  WS   /ws  ← {type:'status', robot_id, fsm_state, sources,
//               episode:{frames,elapsed_s}, episode_index, episodes_total,
//               current_instruction, reset_remaining_s,
//               system:{cpu_pct, ram_free_gb, disk_free_gb}, message}
// ────────────────────────────────────────────────────────────────

const el = (tag, cls, html) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html !== undefined) n.innerHTML = html;
  return n;
};

const state = {};   // robot_id → {card, badge, camEls, healthBody, msg, ep, buttons}

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || r.status);
  return body;
}

function renderRobot(rb) {
  const card = el('div', 'robot-card');
  const head = el('div', 'robot-head');
  head.append(el('span', 'rid', rb.robot_id),
              el('span', 'badge', rb.model));
  const badge = el('span', 'badge IDLE', 'IDLE');
  head.append(badge);
  card.append(head);

  const cams = el('div', 'cams');
  const camEls = {};
  for (const key of rb.cameras) {              // 카메라 수 동적 — manifest가 곧 그리드
    const c = el('div', 'cam');
    const img = el('img');
    img.src = `/api/robots/${rb.robot_id}/cameras/${key}/stream`;
    c.append(img, el('span', 'label', key));
    cams.append(c);
    camEls[key] = c;
  }
  card.append(cams);

  const settings = el('div', 'controls');
  const task = el('input');
  task.type = 'text'; task.placeholder = 'task 이름 (예: towel_fold)';
  const instr = el('input');
  instr.type = 'text'; instr.placeholder = 'task instruction(들) — 세미콜론(;)으로 구분, 에피소드마다 순환';
  instr.style.width = '340px';
  const epTime = el('input'); epTime.type = 'number'; epTime.value = '20';
  epTime.title = 'episode_time_s'; epTime.style.width = '64px';
  const rsTime = el('input'); rsTime.type = 'number'; rsTime.value = '5';
  rsTime.title = 'reset_time_s'; rsTime.style.width = '64px';
  const nEp = el('input'); nEp.type = 'number'; nEp.value = '10';
  nEp.title = 'num_episodes'; nEp.style.width = '64px';
  const rosbag = el('input'); rosbag.type = 'checkbox'; rosbag.id = `rb-${rb.robot_id}`;
  const rosbagLb = el('label', '', 'rosbag'); rosbagLb.htmlFor = rosbag.id;
  settings.append(task, instr,
    el('span', 'dim-label', 'ep(s)'), epTime,
    el('span', 'dim-label', 'reset(s)'), rsTime,
    el('span', 'dim-label', 'N'), nEp, rosbag, rosbagLb);
  card.append(settings);

  const controls = el('div', 'controls');
  const bStart  = el('button', 'b-start', '● Start');
  const bNext   = el('button', 'b-stop', '✓ Save & Next');
  const bRetry  = el('button', 'b-retry', '↺ Retry');
  const bCont   = el('button', 'b-cont', '▶ Continue');
  const bFinish = el('button', 'b-finish', '■ Finish');
  const bAbort  = el('button', 'b-abort', '✕ Abort');
  const msg = el('span'); msg.id = 'msg';
  [bNext, bRetry, bCont, bFinish, bAbort].forEach(b => b.disabled = true);

  bStart.onclick = () => cmd(rb.robot_id, 'start', {
    task: task.value || 'untitled',
    task_instructions: instr.value ? instr.value.split(';').map(s => s.trim()).filter(Boolean) : [],
    episode_time_s: Number(epTime.value) || 20,
    reset_time_s: Number(rsTime.value) || 5,
    num_episodes: Number(nEp.value) || 0,
    rosbag: rosbag.checked
  });
  bNext.onclick   = () => cmd(rb.robot_id, 'save_next');
  bRetry.onclick  = () => cmd(rb.robot_id, 'retry');
  bCont.onclick   = () => cmd(rb.robot_id, 'continue');
  bFinish.onclick = () => cmd(rb.robot_id, 'finish');
  bAbort.onclick  = () => cmd(rb.robot_id, 'abort');
  controls.append(bStart, bNext, bRetry, bCont, bFinish, bAbort, msg);
  card.append(controls);

  const ep = el('div', 'ep', '');
  card.append(ep);

  const ht = el('table', 'health',
    '<thead><tr><th>source</th><th>age(ms)</th><th>seq</th><th>fresh</th></tr></thead>');
  const healthBody = el('tbody');
  ht.append(healthBody);
  card.append(ht);

  document.getElementById('robots').append(card);
  state[rb.robot_id] = { badge, camEls, healthBody, msg, ep,
                         buttons: { bStart, bNext, bRetry, bCont, bFinish, bAbort } };
}

async function cmd(id, action, body) {
  const s = state[id];
  s.msg.textContent = '…';
  try {
    const res = await api(`/api/robots/${id}/record/${action}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    });
    s.msg.textContent = res.dataset_path ? `saved: ${res.dataset_path}`
                       : res.session_id ? `session: ${res.session_id}` : 'ok';
  } catch (e) {
    s.msg.textContent = `오류: ${e.message}`;
  }
}

function applyStatus(m) {
  const s = state[m.robot_id];
  if (!s) return;
  s.badge.textContent = m.fsm_state;
  s.badge.className = `badge ${m.fsm_state}`;
  const active = ['PREFLIGHT', 'WARMUP', 'RECORDING', 'COMMITTING', 'RESETTING']
    .includes(m.fsm_state);
  s.buttons.bStart.disabled = active;
  s.buttons.bNext.disabled = s.buttons.bRetry.disabled = m.fsm_state !== 'RECORDING';
  s.buttons.bCont.disabled = m.fsm_state !== 'RESETTING';
  s.buttons.bFinish.disabled = !['RECORDING', 'RESETTING'].includes(m.fsm_state);
  s.buttons.bAbort.disabled = !active;

  const parts = [];
  if (m.episode_index !== undefined && m.episode_index !== null) {
    const total = m.episodes_total ? `/${m.episodes_total}` : '';
    parts.push(`episode ${m.episode_index + 1}${total}`);
  }
  if (m.episode) parts.push(
    `frames: ${m.episode.frames} | elapsed: ${m.episode.elapsed_s.toFixed(1)}s`);
  if (m.fsm_state === 'RESETTING' && m.reset_remaining_s !== undefined)
    parts.push(`다음 에피소드까지 ${Math.ceil(m.reset_remaining_s)}s (Continue로 즉시 시작)`);
  if (m.current_instruction) parts.push(`“${m.current_instruction}”`);
  s.ep.textContent = parts.join('   ·   ');
  if (m.message) s.msg.textContent = m.message;

  if (m.system) {
    const sys = document.getElementById('sysbar');
    sys.textContent = `CPU ${m.system.cpu_pct?.toFixed(0)}%  ·  ` +
      `RAM free ${m.system.ram_free_gb?.toFixed(1)}GB  ·  ` +
      `Disk free ${m.system.disk_free_gb?.toFixed(0)}GB`;
    sys.className = (m.system.ram_free_gb < 2 || m.system.disk_free_gb < 5)
      ? 'sys warn-sys' : 'sys';
  }

  if (m.sources) {
    s.healthBody.innerHTML = '';
    for (const [key, h] of Object.entries(m.sources)) {
      const tr = el('tr');
      tr.append(el('td', '', key),
                el('td', '', h.age_ms === null ? '—' : Math.round(h.age_ms)),
                el('td', '', h.seq),
                el('td', h.fresh ? 'fresh' : 'stale-t', h.fresh ? 'OK' : 'STALE'));
      s.healthBody.append(tr);
      const cam = s.camEls[key];
      if (cam) cam.classList.toggle('stale', !h.fresh);
    }
  }
}

function connectWs() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  const conn = document.getElementById('conn');
  ws.onopen = () => conn.textContent = '● live';
  ws.onclose = () => { conn.textContent = '○ reconnecting…'; setTimeout(connectWs, 2000); };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === 'status') applyStatus(m);
    if (m.type === 'upload') applyUploadEvent(m);
    if (m.type === 'train') { applyTrainEvent(m); if (m.state === 'DONE') loadPolicies(); }
    if (m.type === 'inference') applyInferEvent(m);
  };
}

// ── 데이터셋 브라우저 / HF 업로드 ──────────────────────────────
const dsJobs = {};   // job_id → row status cell

async function loadDatasets() {
  const body = document.getElementById('ds-body');
  const dsMsg = document.getElementById('ds-msg');
  try {
    const list = await api('/api/datasets');
    body.innerHTML = '';
    for (const d of list) {
      const tr = el('tr');
      const hf = el('td', '', d.hf_repo_id || '—');
      const act = el('td');
      const up = el('button', 'b-start', '↑ HF');
      up.style.cssText = 'padding:2px 10px;font-size:11px';
      up.onclick = async () => {
        const repo = prompt('HF repo id (예: user/dataset):');
        if (!repo) return;
        const token = prompt('HF 토큰 (메모리에만 사용, 저장 안 됨):');
        if (!token) return;
        try {
          const r = await api(`/api/datasets/${d.dataset_id}/upload`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ repo_id: repo, token, private: true })
          });
          hf.textContent = 'uploading…';
          dsJobs[r.job_id] = hf;
        } catch (e) { hf.textContent = `오류: ${e.message}`; }
      };
      act.append(up);
      tr.append(el('td', '', d.dataset_id),
                el('td', '', d.task),
                el('td', '', d.episodes),
                el('td', '', d.frames),
                el('td', '', (d.size_mb ?? 0).toFixed ? d.size_mb.toFixed(0) : d.size_mb),
                el('td', d.validation_status === 'PASS' ? 'fresh' : 'stale-t', d.validation_status),
                hf, act);
      body.append(tr);
    }
    dsMsg.textContent = `${list.length}개`;
    refreshTrainSelect(list);
  } catch (e) { dsMsg.textContent = `로드 실패: ${e.message}`; }
}
document.getElementById('ds-refresh').onclick = loadDatasets;

function applyUploadEvent(m) {
  const cell = dsJobs[m.job_id];
  if (cell) cell.textContent = m.state === 'done' ? (m.repo_id || 'done')
            : m.state === 'error' ? `오류: ${m.detail || ''}` : `${m.state}…`;
  if (['done', 'error', 'cancelled'].includes(m.state)) {
    delete dsJobs[m.job_id];
    if (m.state === 'done') loadDatasets();
  }
}

// ── 학습 패널 ──────────────────────────────────────────────
let trainRun = null;
function refreshTrainSelect(list) {
  const sel = document.getElementById('train-ds');
  sel.innerHTML = '';
  for (const d of list.filter(d => d.validation_status === 'PASS')) {
    const o = document.createElement('option');
    o.value = d.dataset_id; o.textContent = `${d.dataset_id} (${d.episodes}ep)`;
    sel.append(o);
  }
}
document.getElementById('train-start').onclick = async () => {
  const msg = document.getElementById('train-msg');
  try {
    const r = await api('/api/train', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        dataset_id: document.getElementById('train-ds').value,
        policy_type: 'act',
        steps: Number(document.getElementById('train-steps').value) || 2000
      })
    });
    trainRun = r.run_id; msg.textContent = r.run_id;
  } catch (e) { msg.textContent = `오류: ${e.message}`; }
};
document.getElementById('train-stop').onclick = () =>
  trainRun && api(`/api/runs/${trainRun}/stop`, { method: 'POST' }).catch(() => {});

function applyTrainEvent(m) {
  const badge = document.getElementById('train-status');
  badge.textContent = m.state;
  badge.className = 'badge ' + (m.state === 'RUNNING' ? 'RECORDING'
    : m.state === 'DONE' ? 'READY' : m.state === 'ERROR' ? 'FAULT' : '');
  document.getElementById('train-start').disabled =
    ['PREPARING', 'RUNNING', 'STOPPING'].includes(m.state);
  document.getElementById('train-stop').disabled = m.state !== 'RUNNING';
  if (m.step !== undefined && m.step !== null)
    document.getElementById('train-progress').textContent =
      `step ${m.step}` + (m.loss != null ? `  ·  loss ${Number(m.loss).toFixed(4)}` : '');
}

// ── 추론 패널 ──────────────────────────────────────────────
let firstRobotId = null;
async function loadPolicies() {
  const sel = document.getElementById('infer-policy');
  try {
    const list = await api('/api/policies');
    sel.innerHTML = '';
    for (const p of list) {
      const o = document.createElement('option');
      o.value = p.run_id; o.textContent = p.run_id;
      sel.append(o);
    }
    document.getElementById('infer-msg').textContent = `${list.length}개 정책`;
  } catch (e) { document.getElementById('infer-msg').textContent = `로드 실패: ${e.message}`; }
}
document.getElementById('infer-start').onclick = async () => {
  const msg = document.getElementById('infer-msg');
  try {
    const r = await api('/api/inference/start', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ run_id: document.getElementById('infer-policy').value,
                             robot_id: firstRobotId })
    });
    msg.textContent = r.warning || 'started';
  } catch (e) { msg.textContent = `오류: ${e.message}`; }
};
document.getElementById('infer-stop').onclick = () =>
  api('/api/inference/stop', { method: 'POST' }).catch(() => {});

function applyInferEvent(m) {
  const badge = document.getElementById('infer-status');
  badge.textContent = m.state;
  badge.className = 'badge ' + (m.state === 'RUNNING' ? 'RECORDING'
    : m.state === 'STOPPED' ? 'READY' : m.state === 'ERROR' ? 'FAULT' : '');
  document.getElementById('infer-start').disabled = ['LOADING', 'RUNNING'].includes(m.state);
  document.getElementById('infer-stop').disabled = m.state !== 'RUNNING';
  const bits = [];
  if (m.hz != null) bits.push(`${Number(m.hz).toFixed(1)} Hz`);
  if (m.last_action_age_ms != null) bits.push(`last action ${Math.round(m.last_action_age_ms)}ms`);
  if (m.detail) bits.push(m.detail);
  document.getElementById('infer-progress').textContent = bits.join('  ·  ');
}

(async () => {
  const robots = await api('/api/robots');
  firstRobotId = robots[0]?.robot_id || null;
  robots.forEach(renderRobot);
  connectWs();
  loadDatasets();
  loadPolicies();
})();
</script>
</body>
</html>
