<svg xmlns="http://www.w3.org/2000/svg" width="960" height="980" viewBox="0 0 960 980" role="img" aria-labelledby="title description">
<title id="title">SANG System Architecture</title>
<desc id="description">Robot and camera observations flow through ROS 2 to Edge services. Edge reports state and uploads verified recordings to Central. Central stores metadata in SQLite and recordings in the Object Store, and serves Admin, Operator, Data Catalog, and read-only OPC UA clients. MCAP sessions produce observation-only LeRobot v3 datasets without an action feature. A separate Simulation Worker runs fixed Unity or Isaac profiles with physical outputs disconnected.</desc>
<defs><style>
text { font-family:'Segoe UI','Noto Sans',Arial,sans-serif; }
.title { font-size:32px;font-weight:700;fill:#172536; }
.heading { font-size:26px;font-weight:700;fill:#172536; }
.body { font-size:22px;fill:#33455a; }
.small { font-size:19px;fill:#536176; }
.label { font-size:18px;font-weight:700;fill:#416180; }
.box { fill:#fff;stroke:#cbd5e1;stroke-width:1.5; }
.line { stroke:#e2e8f0;stroke-width:1.5; }
.arrow { fill:none;stroke:#527798;stroke-width:2.5;marker-end:url(#arrow); }
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#527798"/></marker></defs>
<rect width="960" height="980" rx="16" fill="#f8fafc"/>

