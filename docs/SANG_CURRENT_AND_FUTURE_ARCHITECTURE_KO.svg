    <rect x="84" y="224" width="326" height="390" rx="13" fill="#edf7f3" stroke="#c1dcd4"/>
    <rect x="448" y="224" width="326" height="390" rx="13" fill="#eef5f6" stroke="#c4d8dc"/>
