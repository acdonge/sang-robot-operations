    <text x="1218" y="423" class="cardBody">선택한 Task Run의 자산만 표시</text>

    <rect x="1197" y="451" width="298" height="64" rx="9" fill="#fff" stroke="#ded1b9"/>
    <text x="1218" y="477" class="cardTitle">On-demand Camera</text>
    <text x="1218" y="498" class="cardBody">선택한 카메라 1대만 MJPEG 미리보기</text>

    <rect x="1197" y="526" width="298" height="64" rx="9" fill="#fff" stroke="#ded1b9"/>
    <text x="1218" y="552" class="cardTitle">Recording Inventory</text>
    <text x="1218" y="573" class="cardBody">완료/실패 세션 메타데이터 조회</text>
