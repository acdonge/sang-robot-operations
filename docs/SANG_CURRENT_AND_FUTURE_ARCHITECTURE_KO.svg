    <text x="127" y="573" class="cardBody">OMY/RB5 vendor USD 관측 프로파일</text>
  </g>

  <!-- Column 2 -->
  <g class="sans">
    <text x="470" y="257" class="columnMeta">02 · PROCESSING EDGE</text>
    <text x="470" y="282" class="columnTitle">로봇별 Processing PC</text>

    <rect x="469" y="301" width="284" height="64" rx="9" fill="#fff" stroke="#c3d5d8"/>
