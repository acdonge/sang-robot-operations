    <rect x="103" y="782" width="97" height="26" rx="13" fill="#dc7b12"/>
    <text x="151.5" y="800" text-anchor="middle" class="pill" fill="#fff">NEXT · P4</text>
    <text x="103" y="834" class="roadTitle">다중 Edge 운영 완성</text>
    <text x="103" y="859" class="roadBody">• Agent별 인증서·포트·ROS domain·runtime 격리</text>
