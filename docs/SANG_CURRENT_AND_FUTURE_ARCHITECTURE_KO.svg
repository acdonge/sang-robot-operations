<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">SANG 로봇 운영 플랫폼 현재 구현 범위와 향후 로드맵</title>
  <desc id="desc">현재 구현된 ROS2 관측, Robot Agent, 읽기 전용 OPC UA, 중앙 Fleet Control Plane, Admin 및 Operator UI와 향후 다중 Edge, 데이터 플랫폼, 안전 제어 및 AAS 확장 계획을 보여주는 아키텍처 다이어그램</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f1e7"/>
      <stop offset="1" stop-color="#e8eee9"/>
    </linearGradient>
    <linearGradient id="currentHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
    <linearGradient id="futureHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17332d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <style>
      .sans { font-family: "Pretendard", "Noto Sans KR", "DejaVu Sans", sans-serif; }
      .mono { font-family: "IBM Plex Mono", "Noto Sans Mono CJK KR", monospace; }
      .title { font-size: 38px; font-weight: 800; letter-spacing: -1.3px; fill: #102a27; }
      .subtitle { font-size: 17px; font-weight: 500; fill: #53645f; }
      .section { font-size: 23px; font-weight: 800; fill: #fff; letter-spacing: -0.4px; }
      .sectionSub { font-size: 13px; font-weight: 600; fill: #d8f3ef; letter-spacing: 0.7px; }
      .columnTitle { font-size: 17px; font-weight: 800; fill: #173a35; }
      .columnMeta { font-size: 11px; font-weight: 700; fill: #5c6e68; letter-spacing: 1.4px; }
      .cardTitle { font-size: 15px; font-weight: 800; fill: #153631; }
      .cardBody { font-size: 12.5px; font-weight: 500; fill: #4a5f59; }
      .cardMono { font-size: 10.8px; font-weight: 600; fill: #61756f; }
      .roadTitle { font-size: 16px; font-weight: 800; fill: #4a2a0b; }
      .roadBody { font-size: 12px; font-weight: 500; fill: #66533f; }
      .pill { font-size: 12px; font-weight: 800; letter-spacing: 0.4px; }
      .footer { font-size: 12px; font-weight: 600; fill: #60716c; }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="url(#bg)"/>
  <path d="M0 0H1600V13H0Z" fill="#ea553b"/>
  <path d="M1280 -20C1400 45 1505 28 1630 110" fill="none" stroke="#ffffff" stroke-width="90" opacity="0.34"/>
  <path d="M-60 960C140 850 185 940 350 1045" fill="none" stroke="#c4ddd5" stroke-width="88" opacity="0.34"/>

  <!-- Header -->
  <g class="sans">
    <text x="66" y="74" class="title">SANG 로봇 운영 플랫폼</text>
    <text x="68" y="105" class="subtitle">현재 구현 범위와 앞으로 구현할 프로그램 · 2026.08</text>
    <rect x="1165" y="50" width="366" height="45" rx="22.5" fill="#fff8ed" stroke="#e7b467"/>
    <circle cx="1190" cy="72.5" r="7" fill="#0f766e"/>
    <text x="1207" y="78" class="pill" fill="#80520b">현재 안전 경계: 관측 전용 · 로봇 제어 없음</text>
  </g>

