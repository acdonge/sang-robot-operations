    <rect x="558" y="782" width="120" height="26" rx="13" fill="#b7791f"/>
    <text x="618" y="800" text-anchor="middle" class="pill" fill="#fff">DATA · OPS</text>
    <text x="558" y="834" class="roadTitle">운영·데이터 플랫폼</text>
    <text x="558" y="859" class="roadBody">• 인증 Preview Relay · PTP/NTP 시간 품질 진단</text>
    <text x="558" y="881" class="roadBody">• Object Storage · 세션 Catalog · LeRobot 변환</text>
    <text x="558" y="903" class="roadBody">• TaskRun 상태 전이 · typed workflow · VLA 학습 연결</text>
    <text x="558" y="925" class="cardMono">MCAP = 원본 원장 · 학습 데이터는 파생 산출물</text>

    <rect x="1050" y="764" width="465" height="178" rx="13" fill="#f1f5f4" stroke="#bacbc6"/>
    <rect x="1068" y="782" width="126" height="26" rx="13" fill="#4b6660"/>
    <text x="1131" y="800" text-anchor="middle" class="pill" fill="#fff">LATER · GATED</text>
    <text x="1068" y="834" class="roadTitle" fill="#243b37">안전 제어·상호운용 확장</text>
    <text x="1068" y="859" class="roadBody">• Control Mode Manager · lease · TTL/deadman</text>
    <text x="1068" y="881" class="roadBody">• 다중 로봇 협업 workflow · zone/process interlock</text>
    <text x="1068" y="903" class="roadBody">• 필요 시 Central OPC UA Aggregator · 이후 AAS mapping</text>
    <text x="1068" y="925" class="cardMono">안전 전제 검증 전에는 actuator command를 추가하지 않음</text>
  </g>

