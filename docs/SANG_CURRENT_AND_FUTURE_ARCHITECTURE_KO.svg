    <text x="127" y="498" class="cardBody">제조사 상태 채널 · D405/D455/OTOS</text>

    <rect x="105" y="526" width="284" height="64" rx="9" fill="#fff" stroke="#c2d8d2"/>
    <rect x="105" y="526" width="7" height="64" rx="3.5" fill="#287c8e"/>
